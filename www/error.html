<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nightlight</title>
<style>
  /* Mirrors the setup page + the main app's theme (frontend/src/index.css). */
  :root {
    --bg: #12172b;
    --text-primary: #edeef5;
    --text-secondary: #8a8fb0;
    --accent: #f4c56a;
    --border: rgba(244, 197, 106, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at top, #171d38 0%, var(--bg) 55%);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .app-icon {
    display: block;
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(244, 197, 106, 0.18);
  }
  h1 {
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    font-weight: 600;
    font-size: 24px;
    margin: 0 0 8px;
  }
  p { color: var(--text-secondary); font-size: 14px; margin: 0 0 28px; line-height: 1.5; }
  button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 12px;
  }
  button:disabled { opacity: 0.6; }
  .primary { background: var(--accent); color: #21170a; }
  .secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-primary);
  }
  .fallback-hint {
    display: none;
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 4px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png" alt="" class="app-icon" />
    <h1>Can't reach your server</h1>
    <p>Nightlight couldn't connect to your server. It may be offline, or this device may
       not have a connection to it right now.</p>
    <button class="primary" id="retry">Try again</button>
    <button class="secondary" id="change">Use a different server</button>
    <p class="fallback-hint" id="fallback">If this keeps happening, fully close and reopen the app.</p>
  </div>

<script>
  const plugin = () => window.Capacitor?.Plugins?.ServerConfig;
  const retryBtn = document.getElementById('retry');
  const changeBtn = document.getElementById('change');
  const fallback = document.getElementById('fallback');

  // The native bridge is injected into this page (served from the local asset server), so the buttons
  // rebuild the WebView against the saved server. If for any reason the bridge isn't present, surface
  // the manual "reopen the app" hint rather than silently doing nothing.
  function requireBridge() {
    if (plugin()) return true;
    fallback.style.display = 'block';
    retryBtn.disabled = true;
    changeBtn.disabled = true;
    return false;
  }

  retryBtn.addEventListener('click', async () => {
    if (!requireBridge()) return;
    retryBtn.disabled = true;
    retryBtn.textContent = 'Reconnecting…';
    // Rebuilds the bridge against the still-saved address.
    await plugin().restart();
  });

  document.getElementById('change').addEventListener('click', async () => {
    if (!requireBridge()) return;
    // Cleared address -> the restarted bridge boots into the setup page.
    await plugin().clear();
    await plugin().restart();
  });

  // If the bridge never shows up shortly after load, reveal the manual fallback.
  setTimeout(() => { if (!plugin()) requireBridge(); }, 1500);
</script>
</body>
</html>
