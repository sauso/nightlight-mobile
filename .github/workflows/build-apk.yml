name: Build and publish APK

# Fires when a release tag is pushed (matching the existing tag-per-release flow:
# bump versionCode/versionName + CHANGELOG, commit, tag vX.Y.Z). The tag build
# produces a signed APK and attaches it to that tag's GitHub Release, so releases
# self-publish an installable download. Also runnable manually for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write # required to create/attach the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22.
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8's capacitor-android module compiles with source release 21.
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # NOTE: no google-services.json is baked in. Nightlight is self-hosted, so the released APK
      # is generic — each install initializes Firebase at RUNTIME from its own server's config
      # (see FirebaseInitPlugin.kt + the web app's pushNotifications.js). The firebase-messaging
      # SDK still ships via @capacitor/push-notifications; only the project config is per-server.

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # The release signing config only activates when android/key.properties exists
      # (see android/app/build.gradle). Both the keystore and its passwords live only
      # in repo secrets - never in git - and are reconstructed here at build time. Must
      # be the SAME keystore the app was first signed with, or updates won't install
      # over an existing install (Android rejects a signature change).
      - name: Reconstruct signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        # chmod is belt-and-suspenders: the executable bit is also set in git, but this
        # guarantees the build even if a future checkout loses it (Windows commits drop it).
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      # On a tag, GITHUB_REF_NAME is like "v0.3.1" -> version "0.3.1". On a manual
      # (workflow_dispatch) run it's the branch name, so the APK is just named after
      # that for artifact download - no Release is published (see the gated step below).
      - name: Name the APK after the version
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "nightlight-${VERSION}.apk"
          echo "path=nightlight-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Always available (both tag and manual runs) - lets a manual run be download-tested
      # from the Actions run page without publishing anything.
      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightlight-apk
          path: ${{ steps.apk.outputs.path }}

      # Pull the matching section out of CHANGELOG.md for the release notes body.
      - name: Extract changelog section
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "APK build for ${GITHUB_REF_NAME}." > release-notes.md
          fi

      # Only real tags publish a Release - a manual run stops at the artifact above.
      - name: Publish GitHub Release with the APK attached
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.apk.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
